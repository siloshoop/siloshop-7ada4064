name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # 1. Run RLS regression tests against the live anon endpoint.
      #    Skip gracefully if secrets are not configured on the repository so
      #    forked PRs / fresh clones do not fail the workflow. Configure
      #    VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY under
      #    Repository Settings -> Secrets and variables -> Actions to enable.
      - name: Check Supabase secrets present
        id: check_secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets not configured — skipping RLS regression tests."
          fi

      - name: Run security regression tests
        if: steps.check_secrets.outputs.present == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bunx vitest run src/test/security-rls.test.ts

      # 2. Fail the build if a scanner report contains critical findings.
      #    The scan report can be produced by `supabase db lint --output json > security-scan.json`
      #    in a previous step, or fetched as an artifact from the Lovable scanner.
      - name: Enforce critical-finding gate
        run: node scripts/security-gate.mjs security-scan.json