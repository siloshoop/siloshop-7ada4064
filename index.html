  <body>
    <style>
      html, body { background: #ffffff; }
      #app-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background: #ffffff;
        transition: opacity .35s ease;
      }
      #app-splash.is-hidden { opacity: 0; pointer-events: none; }
      #app-splash img { width: 148px; height: 148px; object-fit: contain; animation: splash-pop .6s cubic-bezier(.22,1,.36,1) both; }
      #app-splash .splash-bar { width: 132px; height: 3px; border-radius: 999px; background: #ede9fe; overflow: hidden; }
      #app-splash .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #9333ea, #ec4899); animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
      @keyframes splash-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img, #app-splash .splash-bar span { animation: none; }
      }
    </style>
    <div id="app-splash" aria-hidden="true">
      <img src="/pwa-512x512.png" alt="" fetchpriority="high" />
      <div class="splash-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        var el = document.getElementById('app-splash');
        if (!el) return;
        setTimeout(function () {
          el.classList.add('is-hidden');
          setTimeout(function () { el.remove(); }, 400);
        }, 250);
      });
    </script>
  </body>
