  <body>
    <style>
      html, body { background-color: #ffffff; margin: 0; }
      #app-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background-color: #ffffff;
        opacity: 1;
        transition: opacity .45s ease;
        padding-bottom: env(safe-area-inset-bottom);
      }
      #app-splash.is-hidden { opacity: 0; pointer-events: none; }
      #app-splash img {
        width: clamp(104px, 34vmin, 176px);
        height: clamp(104px, 34vmin, 176px);
        object-fit: contain;
        display: block;
        animation: splash-pop .6s cubic-bezier(.22,1,.36,1) both;
      }
      #app-splash .splash-bar { width: clamp(96px, 28vmin, 144px); height: 3px; border-radius: 999px; background: #ede9fe; overflow: hidden; }
      #app-splash .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #9333ea, #ec4899); animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes splash-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition: none; }
        #app-splash img, #app-splash .splash-bar span { animation: none; }
      }
    </style>
    <div id="app-splash" aria-hidden="true">
      <img src="/pwa-512x512.png" alt="" fetchpriority="high" width="512" height="512" />
      <div class="splash-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var removed = false;
        function hideSplash() {
          if (removed) return;
          var el = document.getElementById('app-splash');
          if (!el) return;
          removed = true;
          el.classList.add('is-hidden');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
        }
        function whenAppReady() {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            requestAnimationFrame(function () { setTimeout(hideSplash, 120); });
            return true;
          }
          return false;
        }
        if (!whenAppReady()) {
          var observer = new MutationObserver(function () { if (whenAppReady()) observer.disconnect(); });
          observer.observe(document.getElementById('root'), { childList: true });
          setTimeout(function () { observer.disconnect(); hideSplash(); }, 6000);
        }
      })();
    </script>
  </body>
