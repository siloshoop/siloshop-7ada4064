name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # 1. Run RLS regression tests against the live anon endpoint.
      - name: Run security regression tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bunx vitest run src/test/security-rls.test.ts

      # 2. Fail the build if a scanner report contains critical findings.
      #    The scan report can be produced by `supabase db lint --output json > security-scan.json`
      #    in a previous step, or fetched as an artifact from the Lovable scanner.
      - name: Enforce critical-finding gate
        run: node scripts/security-gate.mjs security-scan.json